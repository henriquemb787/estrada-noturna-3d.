
name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          mkdir extracted
          unzip -q Estrada_Noturna_3D_Projeto_Android_com_Capa.zip -d extracted
          cp -a extracted/. .

      - name: Instalar dependências
        run: npm install

      - name: Preparar jogo
        run: npm run build

      - name: Criar aplicativo Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Noturna-3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
